# Run the chatqalc mod inside a headless Minecraft 26.2 client to verify
# that it loads and doesn't crash at runtime.
#
# This workflow uses MC-Runtime-Test (https://github.com/headlesshq/mc-runtime-test)
# which itself uses HeadlessMc to launch the Minecraft client without a GUI.
name: Runtime Test (MC 26.2)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build mod jar
        run: ./gradlew build --stacktrace

      - name: Stage mod jar for test client
        run: |
          mkdir -p run/mods
          # Pick the remapped mod jar (the one without -sources or -dev)
          jar=$(ls build/libs/chatqalc-*.jar | grep -v sources | grep -v dev | head -n1)
          echo "Using mod jar: $jar"
          cp "$jar" run/mods/chatqalc.jar

      - name: Run Minecraft 26.2 client headlessly
        uses: headlesshq/mc-runtime-test@v4.5.1
        with:
          mc: "26.2"
          modloader: "fabric"
          regex: ".*fabric.*"
          mc-runtime-test: "fabric"
          java: "25"
          # Pull Fabric API matching 26.2 (update as new versions are published).
          fabric-api: "0.157.0+26.2"
          # Use the Fabric GameTest API if you register @GameTest helpers in src/test.
          fabric-gametest-api: "none"
          # Run on a virtual framebuffer so the GLFW window can initialise.
          xvfb: "true"
          # Cache .minecraft across runs to speed up CI.
          cache-mc: "github"
          # Fail the workflow if 0 GameTests were executed (catches load-time crashes).
          headlessmc-command: "--jvm -DMcRuntimeGameTestMinExpectedGameTests=1"

# Local smoke test - launches a headless Minecraft 26.2 client with the mod loaded.
# Run this manually on a Linux machine (or WSL2 / macOS with Xvfb installed) to
# quickly verify the mod loads without opening the GUI launcher.
name: Local Smoke Test

on:
  workflow_dispatch: {}

jobs:
  local-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Download HeadlessMc launcher
        run: |
          curl -L -o hmc.jar https://github.com/headlesshq/headlessmc/releases/download/v2.10.0/headlessmc-launcher-2.10.0.jar

      - name: Build mod
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Stage mod jar
        run: |
          mkdir -p run/mods
          jar=$(ls build/libs/chatqalc-*.jar | grep -v sources | grep -v dev | head -n1)
          cp "$jar" run/mods/chatqalc.jar

      - name: Launch headless MC 26.2 with chatqalc (15s)
        run: |
          # HeadlessMc will download Minecraft 26.2 + Fabric Loader 0.19.3 on first run.
          # We then launch in headless (-lwjgl) mode, send a "quit" message after 15s,
          # and let HMC tear the process down.
          xvfb-run -a java -jar hmc.jar \
            --jvm "-Djava.awt.headless=true" \
            launch fabric:26.2 -lwjgl \
            --mods run/mods/chatqalc.jar \
            --timeout 15 || true

      - name: Print log
        if: always()
        run: |
          ls -la ~/HeadlessMC/ 2>/dev/null || true
          cat ~/HeadlessMC/logs/*.log 2>/dev/null | tail -200 || true
